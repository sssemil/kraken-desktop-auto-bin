name: Update AUR Package

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if version unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils unzip curl

      - name: Run update script
        run: bash update.sh

      - name: Check for changes
        id: diff
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          git add PKGBUILD .SRCINFO
          VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            if [ "${FORCE_UPDATE}" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "No package metadata changes detected; forcing AUR push."
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes detected."
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update to v${VERSION}"
          git push
        env:
          VERSION: ${{ steps.diff.outputs.version }}

      - name: Push to AUR
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.diff.outputs.version }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "${AUR_SSH_KEY}" ]; then
            echo "AUR_SSH_KEY secret is empty or missing." >&2
            exit 1
          fi
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keygen -y -f ~/.ssh/aur_key > /dev/null
          echo "AUR deploy key fingerprint:"
          ssh-keygen -lf ~/.ssh/aur_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          ssh aur@aur.archlinux.org help > /dev/null
          TMP_AUR=$(mktemp -d)
          git clone --depth=1 ssh://aur@aur.archlinux.org/kraken-desktop-auto-bin.git "$TMP_AUR"
          cp -f PKGBUILD .SRCINFO LICENSE kraken.png .gitignore "$TMP_AUR/"
          cd "$TMP_AUR"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update to v${VERSION}" || true
          git push
