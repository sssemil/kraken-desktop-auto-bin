name: Update AUR Package

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if version unchanged'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils unzip curl

      - name: Run update script
        run: bash update.sh

      - name: Check for changes
        id: diff
        run: |
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update to v${VERSION}"
          git push
        env:
          VERSION: ${{ steps.diff.outputs.version }}

      - name: Push to AUR
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.diff.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new"
          TMP_AUR=$(mktemp -d)
          git clone --depth=1 ssh://aur@aur.archlinux.org/kraken-desktop-auto-bin.git "$TMP_AUR"
          cp -f PKGBUILD .SRCINFO LICENSE kraken.png .gitignore "$TMP_AUR/"
          cd "$TMP_AUR"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update to v${VERSION}" || true
          git push
